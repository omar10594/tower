# Network and Security Services

services:
  # Nginx Proxy Manager - Reverse Proxy with GUI
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
      - "${NGINX_ADMIN_PORT:-81}:81"
    volumes:
      - ${DATA_PATH:-./data}/nginx-proxy-manager/data:/data
      - ${DATA_PATH:-./data}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    environment:
      - TZ=${TZ:-America/New_York}

  # Pi-hole - Network-wide Ad Blocking
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${PIHOLE_PORT:-8053}:80"
    volumes:
      - ${DATA_PATH:-./data}/pihole:/etc/pihole
      - ${DATA_PATH:-./data}/pihole-dnsmasq:/etc/dnsmasq.d
    environment:
      - TZ=${TZ:-America/New_York}
      - WEBPASSWORD=${PIHOLE_PASSWORD:-admin}
    cap_add:
      - NET_ADMIN

  # WireGuard - VPN Server
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    ports:
      - "${WIREGUARD_PORT:-51820}:51820/udp"
    volumes:
      - ${DATA_PATH:-./data}/wireguard:/config
      - /lib/modules:/lib/modules
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - SERVERURL=${DOMAIN:-auto}
      - SERVERPORT=${WIREGUARD_PORT:-51820}
      - PEERS=${WIREGUARD_PEERS:-5}

  # Traefik - Modern Reverse Proxy
  # NOTE: Before starting, create acme.json with: touch acme.json && chmod 600 acme.json
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_PATH:-./data}/traefik:/etc/traefik
      - ${DATA_PATH:-./data}/traefik/acme.json:/acme.json
    environment:
      - TZ=${TZ:-America/New_York}
