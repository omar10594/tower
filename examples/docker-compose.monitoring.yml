# Monitoring and Management Services

services:
  # Grafana - Metrics Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-./data}/grafana:/var/lib/grafana
    environment:
      - TZ=${TZ:-America/New_York}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}

  # Prometheus - Metrics Collection
  # NOTE: Copy examples/prometheus.yml to your config directory before starting
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${DATA_PATH:-./data}/prometheus:/prometheus
      - ${DATA_PATH:-./data}/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    environment:
      - TZ=${TZ:-America/New_York}

  # Uptime Kuma - Status Monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - ${DATA_PATH:-./data}/uptime-kuma:/app/data
    environment:
      - TZ=${TZ:-America/New_York}

  # Netdata - Real-time Performance Monitoring
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    ports:
      - "${NETDATA_PORT:-19999}:19999"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=${TZ:-America/New_York}

  # Scrutiny - Hard Drive Monitoring
  # NOTE: Adjust the 'devices' section below to match your actual storage devices
  # Use 'ls /dev/sd*' or 'lsblk' to see your available drives
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    ports:
      - "${SCRUTINY_PORT:-8090}:8080"
    volumes:
      - /run/udev:/run/udev:ro
      - ${DATA_PATH:-./data}/scrutiny:/opt/scrutiny/config
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/sda  # Adjust to your drives
      - /dev/sdb  # Adjust to your drives
    environment:
      - TZ=${TZ:-America/New_York}
