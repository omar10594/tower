version: "3.9"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_tower
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - /mnt/user/appdata/n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: n8n_tower_cf_tunnel
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - n8n_network
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}

networks:
  n8n_network:
    external: true
